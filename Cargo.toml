[package]
name = "garden"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "a blossom server where files are kept alive by sats"

[dependencies]
ritualistic = { version = "0.2.4", default-features = false }
orangedb = "0.1"
ark-client = "0.12"
ark-core = "0.12"
bitcoin = "0.32"

tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusty-s3 = "0.11"
redb = "4"
hypereffect = "0.3"
ed25519-dalek = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
toml_edit = "0.25"
async-trait = "0.1"
bytes = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
sha2 = "0.10"
lowercase-hex = "0.1"
dashmap = "6"
rand = "0.9"
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
hypereffect = { version = "0.3", features = ["client"] }

[profile.release]
# accounting: overflows must never go unnoticed
overflow-checks = true
